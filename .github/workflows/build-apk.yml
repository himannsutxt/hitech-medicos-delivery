name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --org com.hitechmedicos --project-name hitech_delivery --platforms android .
          rm -f test/widget_test.dart
          python3 tool/prepare_android.py

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Release signing key
        env:
          KS: ${{ secrets.HMD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/hmd.jks"
            echo "HMD_KEYSTORE=$RUNNER_TEMP/hmd.jks" >> "$GITHUB_ENV"
            echo "Signing with the Hitech release key"
          else
            echo "::warning::HMD_KEYSTORE_BASE64 secret not set. APK is signed with a temporary debug key; riders must uninstall before updating."
          fi

      - name: Build APK
        env:
          HMD_KEYSTORE_PASSWORD: ${{ secrets.HMD_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --build-name 1.2.0 --build-number ${{ github.run_number }}

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk "HitechMedicosDelivery-1.0.0-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HitechMedicosDelivery-APK
          path: app/HitechMedicosDelivery-*.apk
          retention-days: 90

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" HitechMedicosDelivery-*.apk --title "Hitech Medicos Delivery ${{ github.ref_name }}" --notes "Android app build ${{ github.run_number }}" || gh release upload "${{ github.ref_name }}" HitechMedicosDelivery-*.apk --clobber
